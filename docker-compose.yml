version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Relational Database Service
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: intel_protect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-intel_protect_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intel_protect_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - intel_protect_net

  # ============================================================================
  # Flask Backend API Service
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: intel_protect_backend
    restart: unless-stopped
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-key-min-32-chars-long}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-intel_protect_db}
      CORS_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173
      BACKEND_PORT: 5000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      - intel_protect_net

  # ============================================================================
  # React + Vite Frontend Service (Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intel_protect_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: /api
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - intel_protect_net

volumes:
  postgres_data:
    driver: local

networks:
  intel_protect_net:
    driver: bridge
